name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: node --check app.js
      - name: HTML validation
        run: npx --yes html-validate@11.16.2 index.html
      - name: Required assets exist
        run: |
          status=0
          for f in index.html styles.css app.js .nojekyll; do
            if [ ! -f "$f" ]; then echo "::error::missing required file: $f"; status=1; fi
          done
          exit $status
